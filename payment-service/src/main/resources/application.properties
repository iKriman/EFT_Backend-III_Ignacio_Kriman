spring.application.name=payment-service
server.port=8082
spring.config.import=optional:configserver:${CONFIG_SERVER_URL:http://localhost:8888}
eureka.client.service-url.defaultZone=${EUREKA_URL:http://localhost:8761/eureka/}
eureka.instance.prefer-ip-address=true
spring.security.oauth2.resourceserver.jwt.issuer-uri=${OAUTH_ISSUER:http://localhost:9000}
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=${OAUTH_JWKS_URI:http://localhost:9000/oauth2/jwks}
management.endpoints.web.exposure.include=health,info,circuitbreakers,circuitbreakerevents
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer
bank.events.transaction-topic=bank.transactions.completed
